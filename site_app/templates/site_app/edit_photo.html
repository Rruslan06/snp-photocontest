{% extends 'site_app/base.html' %}

{% block content %}
    <h2>Редактировать фотографию</h2>
    
    <!--метод чтобы отправлять данные, плюс  атрибут обязательный enctype-->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        

        {{ form.as_p }}
        
        <button type="submit">Сохранить изменения</button>
    </form>
{% endblock %}
