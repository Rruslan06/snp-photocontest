
{% extends "site_app/base.html" %}

{% load socialaccount %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-4">

        <h3 class="text-center mb-4">Вход</h3>
        
        
        <form method="POST" action="{% url 'account_login' %}">
            {% csrf_token %}
            
            {{ form.as_p }}
            <button class="btn btn-primary w-100" type="submit">Войти</button>
        </form>

        <hr>
        
        <a href="{% provider_login_url 'yandex' %}" class="btn btn-warning w-100 mb-3">Войти через Яндекс</a>
        
        <p class="text-center">Нет аккаунта? <a href="{% url 'account_signup' %}">Регистрация</a></p>
    </div>
</div>
{% endblock %}
