{% extends 'frontend/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h3 class="text-center mb-4">Регистрация</h3>
        
        <form id="register-form">
            <div class="mb-3">
                <label class="form-label">Имя пользователя</label>
                <input type="text" id="reg-username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email (необязательно)</label>
                <input type="email" id="reg-email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль (мин. 8 символов)</label>
                <input type="password" id="reg-password" class="form-control" minlength="8" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Повторите пароль</label>
                <input type="password" id="reg-password-confirm" class="form-control" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
            <div id="reg-error-msg" class="text-danger mt-2 text-center" style="display:none;"></div>
        </form>

        <hr>
        <p class="text-center">Уже есть аккаунт? <a href="/login/">Войти</a></p>
    </div>
</div>

<script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const passwordConfirm = document.getElementById('reg-password-confirm').value;
        const errorBox = document.getElementById('reg-error-msg');
        errorBox.style.display = 'none';

        if (password !== passwordConfirm) {
            errorBox.innerText = 'Пароли не совпадают!';
            errorBox.style.display = 'block';
            return;
        }

        fetch('/api/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: username,
                email: email,
                password: password,
                password_confirm: passwordConfirm
            })
        })
        .then(async res => {
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.errors || 'Ошибка регистрации (возможно, такое имя уже занято)');
            }
            return data;
        })
        .then(data => {
            
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            localStorage.setItem('username', data.username);
            window.location.href = '/profile/';
        })
        .catch(error => {
            errorBox.innerText = error.message;
            errorBox.style.display = 'block';
        });
    });
</script>
{% endblock %}
