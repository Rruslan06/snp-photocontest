<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>S&P Фотоконкурс (SPA)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">


    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
   
            <a class="navbar-brand" href="/">S&P Фотоконкурс (SPA)</a>

            <div class="d-flex" id="nav-auth-block">

            </div>
        </div>
    </nav>



    <main class="container mt-4 flex-grow-1">

        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-light text-center py-3 mt-4 border-top">
        <div class="container"><span class="text-muted">© 2026 S&P SPA Frontend</span></div>
    </footer>




    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('access_token');
            const username = localStorage.getItem('username') || 'Пользователь'; 
            const authBlock = document.getElementById('nav-auth-block');
            
            if (token) {
                
                authBlock.innerHTML = `
                    <span class="navbar-text me-3 text-light">Привет, ${username}!</span>
                    <a href="/profile/" class="btn btn-outline-light btn-sm me-2">Мой профиль</a>
                    <button class="btn btn-outline-danger btn-sm" onclick="globalLogout()">Выйти</button>
                `;

               
                const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
                const socketUrl = `${wsProtocol}${window.location.host}/ws/notifications/?token=${token}`;
                
                const notificationSocket = new WebSocket(socketUrl);


                notificationSocket.onmessage = function(e) {
                    const data = JSON.parse(e.data);

                    alert("🔔 УВЕДОМЛЕНИЕ:\n" + data.message);
                };

                notificationSocket.onclose = function(e) {
                    console.log('WebSocket отключен');
                };
                
                notificationSocket.onerror = function(e) {
                    console.error('Ошибка WebSocket:', e);
                };

            } else {
                
                authBlock.innerHTML = `
                    <a href="/login/" class="btn btn-outline-light btn-sm me-2">Войти</a>
                    <a href="/register/" class="btn btn-primary btn-sm">Регистрация</a>
                `;
            }
        });

        function globalLogout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('username');
            window.location.href = '/login/';
        }
    </script>
</body>
</html>
