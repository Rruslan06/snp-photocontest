{% extends 'frontend/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h3 class="text-center mb-4">Вход (JS + JWT)</h3>
        
        <form id="login-form">
            <div class="mb-3">
                <label>Имя пользователя</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Пароль</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
            <hr>
                <p class="text-center">Нет аккаунта? <a href="/register/">Регистрация</a></p>
            <div id="error-msg" class="text-danger mt-2 text-center" style="display:none;">Неверный логин или пароль</div>
        </form>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        
        fetch('/api/token/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username: username, password: password }) 
        })
        .then(response => {
            if (!response.ok) throw new Error('Ошибка авторизации');
            return response.json();
        })
        .then(data => {
            
            localStorage.setItem('access_token', data.access);

            localStorage.setItem('refresh_token', data.refresh);

            
            localStorage.setItem('username', username); 
            
            window.location.href = '/profile/';
        })
        .catch(error => {
            document.getElementById('error-msg').style.display = 'block';
        });
    });
</script>
{% endblock %}
