version: '3.8'

services:
  db:
    image: postgres:15
    container_name: snp_postgres
    environment:
      - POSTGRES_DB=photocontest_db
      - POSTGRES_USER=snp_user
      - POSTGRES_PASSWORD=super_user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: